<div class="import-create-template">
    <div class="header-section">
        <div class="header">
            <span>Import Template</span>
        </div>
        <div class="close-icon" (click)="closeDialog()" mat-dialog-close>
            <img src="../assets/images/close.png" alt="close" id="close-icon" />
        </div>
    </div>
    <mat-dialog-content class="import-dialog-content">
        <div class="import-steps">
            <div class="download-template">
                <div class="text"><span>Step 1: Download the template</span></div>
                <div class="button"><button (click)="downloadTemplate()">Download
                        Template
                    </button>
                </div>
                <div class="svg-icon">
                    <svg width="20px" height="20px" viewBox="0 0 24 24" id="meteor-icon-kit__regular-check-circle"
                        fill="none" xmlns="http://www.w3.org/2000/svg" *ngIf="isDownloaded=== true">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M24 12C24 18.6274 18.6274 24 12 24C5.37258 24 0 18.6274 0 12C0 5.37258 5.37258 0 12 0C18.6274 0 24 5.37258 24 12ZM12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM7.70711 12.2929L10 14.5858L16.2929 8.29289C16.6834 7.90237 17.3166 7.90237 17.7071 8.29289C18.0976 8.68342 18.0976 9.31658 17.7071 9.70711L10.7071 16.7071C10.3166 17.0976 9.68342 17.0976 9.29289 16.7071L6.29289 13.7071C5.90237 13.3166 5.90237 12.6834 6.29289 12.2929C6.68342 11.9024 7.31658 11.9024 7.70711 12.2929Z"
                            fill="#1dd91d" />
                    </svg>
                    <svg width="20px" height="20px" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"
                        *ngIf="isDownloaded=== false">
                        <path fill="red"
                            d="M10,0 C15.5228475,0 20,4.4771525 20,10 C20,15.5228475 15.5228475,20 10,20 C4.4771525,20 0,15.5228475 0,10 C0,4.4771525 4.4771525,0 10,0 Z M10,1.39534884 C5.24778239,1.39534884 1.39534884,5.24778239 1.39534884,10 C1.39534884,14.7522176 5.24778239,18.6046512 10,18.6046512 C14.7522176,18.6046512 18.6046512,14.7522176 18.6046512,10 C18.6046512,5.24778239 14.7522176,1.39534884 10,1.39534884 Z M12.2066229,6.83655409 C12.4730122,6.5704103 12.9047155,6.57060929 13.1708593,6.83699857 C13.4370031,7.10338784 13.4368041,7.53509119 13.1704149,7.80123498 L13.1704149,7.80123498 L10.975,9.994 L13.1704149,12.1870677 C13.4368041,12.4532115 13.4370031,12.8849148 13.1708593,13.1513041 C12.9047155,13.4176934 12.4730122,13.4178924 12.2066229,13.1517486 L10.01,10.957 L7.81496625,13.1517486 C7.57521591,13.391278 7.20156116,13.4150698 6.93520889,13.223235 L6.85072984,13.1513041 C6.58458604,12.8849148 6.58478504,12.4532115 6.85117431,12.1870677 L6.85117431,12.1870677 L9.046,9.994 L6.85117431,7.80123498 C6.58478504,7.53509119 6.58458604,7.10338784 6.85072984,6.83699857 C7.11687363,6.57060929 7.54857698,6.5704103 7.81496625,6.83655409 L10.01,9.03 Z" />
                    </svg>
                </div>
            </div>
            <div class="fill-template">
                <div class="text"><span>Step 2: Fill the template with required<br>questions according to the
                        format</span></div>
            </div>
            <div class="upload-template">
                <div class="text"><span>Step 3: Upload the completed template</span></div>
                <div class="button">
                    <label for="fileUpload" class="upload-btn">
                        Upload Questions
                        <input type="file" id="fileUpload" (change)="uploadAuditTemplate($event)" hidden>
                    </label>
                </div>
                <div class="svg-icon">
                    <svg width="20px" height="20px" viewBox="0 0 24 24" id="meteor-icon-kit__regular-check-circle"
                        fill="none" xmlns="http://www.w3.org/2000/svg" *ngIf="isUploaded=== true">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M24 12C24 18.6274 18.6274 24 12 24C5.37258 24 0 18.6274 0 12C0 5.37258 5.37258 0 12 0C18.6274 0 24 5.37258 24 12ZM12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM7.70711 12.2929L10 14.5858L16.2929 8.29289C16.6834 7.90237 17.3166 7.90237 17.7071 8.29289C18.0976 8.68342 18.0976 9.31658 17.7071 9.70711L10.7071 16.7071C10.3166 17.0976 9.68342 17.0976 9.29289 16.7071L6.29289 13.7071C5.90237 13.3166 5.90237 12.6834 6.29289 12.2929C6.68342 11.9024 7.31658 11.9024 7.70711 12.2929Z"
                            fill="#1dd91d" />
                    </svg>
                    <svg width="20px" height="20px" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"
                        *ngIf="isUploaded=== false">
                        <path fill="red"
                            d="M10,0 C15.5228475,0 20,4.4771525 20,10 C20,15.5228475 15.5228475,20 10,20 C4.4771525,20 0,15.5228475 0,10 C0,4.4771525 4.4771525,0 10,0 Z M10,1.39534884 C5.24778239,1.39534884 1.39534884,5.24778239 1.39534884,10 C1.39534884,14.7522176 5.24778239,18.6046512 10,18.6046512 C14.7522176,18.6046512 18.6046512,14.7522176 18.6046512,10 C18.6046512,5.24778239 14.7522176,1.39534884 10,1.39534884 Z M12.2066229,6.83655409 C12.4730122,6.5704103 12.9047155,6.57060929 13.1708593,6.83699857 C13.4370031,7.10338784 13.4368041,7.53509119 13.1704149,7.80123498 L13.1704149,7.80123498 L10.975,9.994 L13.1704149,12.1870677 C13.4368041,12.4532115 13.4370031,12.8849148 13.1708593,13.1513041 C12.9047155,13.4176934 12.4730122,13.4178924 12.2066229,13.1517486 L10.01,10.957 L7.81496625,13.1517486 C7.57521591,13.391278 7.20156116,13.4150698 6.93520889,13.223235 L6.85072984,13.1513041 C6.58458604,12.8849148 6.58478504,12.4532115 6.85117431,12.1870677 L6.85117431,12.1870677 L9.046,9.994 L6.85117431,7.80123498 C6.58478504,7.53509119 6.58458604,7.10338784 6.85072984,6.83699857 C7.11687363,6.57060929 7.54857698,6.5704103 7.81496625,6.83655409 L10.01,9.03 Z" />
                    </svg>
                </div>
            </div>
            <div class="template-name">
                <div class="text"><span>Step 4: Provide template name</span></div>
                <div class="button">
                    <button *ngIf='!isTemplateName' [class.disabled]="!isUploaded" [disabled]="isUploaded === undefined"
                        (click)="createTemplateName()">Template Name</button>
                    <input *ngIf='isTemplateName && isUploaded' type="text" id="templateName"
                        [(ngModel)]="templateNameValue" placeholder="Template Name">
                </div>
                <div class="svg-icon">
                    <svg width="20px" height="20px" viewBox="0 0 24 24" id="meteor-icon-kit__regular-check-circle"
                        fill="none" xmlns="http://www.w3.org/2000/svg"
                        *ngIf="(templateNameValue.length > 0) && (isTemplateName === true)">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M24 12C24 18.6274 18.6274 24 12 24C5.37258 24 0 18.6274 0 12C0 5.37258 5.37258 0 12 0C18.6274 0 24 5.37258 24 12ZM12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM7.70711 12.2929L10 14.5858L16.2929 8.29289C16.6834 7.90237 17.3166 7.90237 17.7071 8.29289C18.0976 8.68342 18.0976 9.31658 17.7071 9.70711L10.7071 16.7071C10.3166 17.0976 9.68342 17.0976 9.29289 16.7071L6.29289 13.7071C5.90237 13.3166 5.90237 12.6834 6.29289 12.2929C6.68342 11.9024 7.31658 11.9024 7.70711 12.2929Z"
                            fill="#1dd91d" />
                    </svg>
                    <svg width="20px" height="20px" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"
                        *ngIf="(templateNameValue.length === 0 ) && isTemplateName === true">
                        <path fill="red"
                            d="M10,0 C15.5228475,0 20,4.4771525 20,10 C20,15.5228475 15.5228475,20 10,20 C4.4771525,20 0,15.5228475 0,10 C0,4.4771525 4.4771525,0 10,0 Z M10,1.39534884 C5.24778239,1.39534884 1.39534884,5.24778239 1.39534884,10 C1.39534884,14.7522176 5.24778239,18.6046512 10,18.6046512 C14.7522176,18.6046512 18.6046512,14.7522176 18.6046512,10 C18.6046512,5.24778239 14.7522176,1.39534884 10,1.39534884 Z M12.2066229,6.83655409 C12.4730122,6.5704103 12.9047155,6.57060929 13.1708593,6.83699857 C13.4370031,7.10338784 13.4368041,7.53509119 13.1704149,7.80123498 L13.1704149,7.80123498 L10.975,9.994 L13.1704149,12.1870677 C13.4368041,12.4532115 13.4370031,12.8849148 13.1708593,13.1513041 C12.9047155,13.4176934 12.4730122,13.4178924 12.2066229,13.1517486 L10.01,10.957 L7.81496625,13.1517486 C7.57521591,13.391278 7.20156116,13.4150698 6.93520889,13.223235 L6.85072984,13.1513041 C6.58458604,12.8849148 6.58478504,12.4532115 6.85117431,12.1870677 L6.85117431,12.1870677 L9.046,9.994 L6.85117431,7.80123498 C6.58478504,7.53509119 6.58458604,7.10338784 6.85072984,6.83699857 C7.11687363,6.57060929 7.54857698,6.5704103 7.81496625,6.83655409 L10.01,9.03 Z" />
                    </svg>
                </div>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="center" class="mat-dialog-actions-section">
        <button
            [class.disabled]="!isUploaded || !isTemplateName || ((templateNameValue.length === 0 ) && isTemplateName === true)"
            [disabled]="(isUploaded === undefined) || !isTemplateName || ((templateNameValue.length === 0 ) && isTemplateName === true)" (click)="importTemplate()"
            mat-button mat-dialog-close>Import</button>
    </mat-dialog-actions>
</div>
