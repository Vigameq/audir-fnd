<div class="sidebar">
  <img src="assets/images/auditLogo.png" alt="Logo" id="logo" />
  <ul class="nav-list">
    <li routerLinkActive="active" *ngFor="let item of navItems">
      <a [routerLink]="item.path" (click)="sendDataToAppComponent(item.header)">
        <span class="icon-wrap">
          <img [src]="item.src" [alt]="item.label" class="icons" />
        </span>
        <span class="label">{{ item.label }}</span>
      </a>
    </li>
  </ul>
</div>
