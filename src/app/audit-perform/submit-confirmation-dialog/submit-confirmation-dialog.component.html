<div class="submit-confirmation-container">
  <h1 mat-dialog-title>Submission confirmation</h1>
  <div mat-dialog-content class="content">
    <p>Do you want to proceed with submitting?</p>
  </div>
  <div class="action-buttons" mat-dialog-actions align="end">
    <button class="cancel" (click)="onCancel()">No</button>
    <button class="submit" (click)="onConfirm()">Yes</button>
  </div>
</div>
