<div class="audit-perfom">
    <div class="search-dropdown-section">
        <div class="audit-perform-search-bar">
            <input type="text" [(ngModel)]="searchQuery" placeholder="Search by code" (input)="onSearch()"
                class="audit-perform-search-input" />

            <button *ngIf="searchQuery" (click)="clearSearch()" class="clear-btn">
                &#10006; <!-- "X" symbol for close -->
            </button>
        </div>
        <div class="dropdown-section">
            <div class="standard-dropdown-section" (click)="onStandardDropdownClick()" #standardDropdown>
                <select class="standard-dropdown-select" (change)="onStandardOptionChange($event)"
                    [(ngModel)]="standardSelectedOption">
                    <option value="" disabled selected>Select Standards</option>
                    <option *ngFor="let standardOption of standardDropdownOptions" [value]="standardOption">
                        {{ standardOption }}
                    </option>
                </select>
                <div class="dropdown-arrow">
                    <app-dropdown-arrow-icons [isOpen]="isStandardDropdownOpen"></app-dropdown-arrow-icons>
                </div>
            </div>
        </div>
    </div>
    <div class="audit-perform-container-section">
        <div class="report-container" *ngFor="let report of reportsData">
            <div class="name-type-section">
                <div class="audit-name-section">
                    <span class="report-name">{{report.name}}</span>
                </div>
                <div class="type-section">
                    <span class="standard-type">{{report.standardType}}</span>
                    <span class="vertical-bar">|</span>
                    <span class="function-type">{{report.functionType}}</span>
                </div>
            </div>
            <div class="city-and-download-section">
                <div class="city-country-section">
                    <span class="city-name">{{report.city}}</span>
                    <span class="vertical-bar">|</span>
                    <span class="country-name">{{report.country}}</span>
                </div>
                <div class="download-button">
                    <button>Download</button>
                </div>
            </div>
        </div>
    </div>
</div>
