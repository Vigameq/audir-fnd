<div class="container audit-plan-container">
    <div class="main-content">
        <div class="top-bar">
            <div class="toggle-group">
                <button class="toggle-button active">✔ Physical</button>
                <button class="toggle-button">Offline</button>
                <button class="toggle-button">Virtual</button>
            </div>
            <button class="import-button">+ Import</button>
        </div>
        <div class="form-container">
            <form [formGroup]="auditPlanForm" (ngSubmit)="onSubmit()">
                <div class="link-audit-row">
                    <div class="link-audit-label">
                        <label for="linkAudit" class="form-label">Link Audit</label>
                    </div>
                    <div class="link-audit-select">
                        <select id="linkAudit" class="dropdown-select" formControlName="linkAudit" name="linkAudit"
                            required>
                            <option value="" disabled selected>Select Audit</option>
                            <option *ngFor="let linkAuditOption of availableOptions" [value]="linkAuditOption">
                                {{ linkAuditOption }}</option>
                        </select>
                    </div>
                </div>
                <div class="audit-title-and-functions-row">
                    <div class="audit-title">
                        <label for="audit-title" class="form-label">Audit Title</label>
                        <select id="audit-title" class="dropdown-select" formControlName="auditTitle" name="auditTitle"
                            required>
                            <option value="" disabled selected>Select Audit Title</option>
                            <option *ngFor="let auditTitleOption of availableOptions" [value]="auditTitleOption">
                                {{ auditTitleOption }}</option>
                        </select>
                    </div>
                    <div class="functions">
                        <label for="function" class="form-label">Functions</label>
                        <select id="function" class="dropdown-select" formControlName="functions" name="functions"
                            required>
                            <option value="" disabled selected>Select Audit Title</option>
                            <option *ngFor="let functionOption of availableOptions" [value]="functionOption">
                                {{ functionOption }}</option>
                        </select>
                    </div>
                </div>
                <div class="templates-row">
                    <div class="template">
                        <label for="templates" class="form-label">Template</label>
                        <select id="templates" class="dropdown-select" formControlName="templateValue"
                            name="templateValue" required>
                            <option value="" disabled selected>Select template..</option>
                            <option *ngFor="let templateOption of availableOptions" [value]="templateOption">
                                {{ templateOption }}</option>
                        </select>
                    </div>
                    <div class="function-template">
                        <label for="function-templates" class="form-label">Functions Template</label>
                        <select id="function-templates" class="dropdown-select" formControlName="functionTemplateValue"
                            name="functionTemplateValue" required>
                            <option value="" disabled selected>Select template..</option>
                            <option *ngFor="let FunctionTemplateOption of availableOptions"
                                [value]="FunctionTemplateOption">
                                {{ FunctionTemplateOption }}</option>
                        </select>
                    </div>
                </div>
                <div class="date-time-row">
                    <div class="start-date-time">
                        <label for="start-date-time" class="form-label">Start Date & Time</label>
                        <input type="datetime-local" id="start-date-time" class="form-control"
                            formControlName="startDateTime" name="startDateTime" required />
                    </div>
                    <div class="end-date-time">
                        <label for="end-date-time" class="form-label">End Date & Time</label>
                        <input type="datetime-local" id="end-date-time" class="form-control"
                            formControlName="endDateTime" name="endDateTime" required />
                    </div>
                </div>
                <div class="auditees-auditors-row">
                    <div class="auditors">
                        <label for="auditorDropdown" class="auditor-label">Auditors</label>
                        <div class="auditorDropdown">
                            <button class="auditor-dropdown-button" type="button" id="auditor-select-dropdown"
                                (click)="toggleDropdown()">
                                Select auditors
                            </button>
                            <div *ngIf="isAuditorDropdownOpen" class="auditor-dropdown-options"
                                formControlName="auditorValue">
                                <div class="auditor-check" *ngFor="let auditorOption of availableOptions">
                                    <label class="auditor-dropdown-option">
                                        <input class="auditor-check-input" type="checkbox" [value]="auditorOption"
                                            (change)="onAuditorSelectionChange($event)" />
                                        {{ auditorOption }}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="auditees">
                        <label for="auditeeDropdown" class="auditee-label">Auditees</label>
                        <div class="auditeeDropdown">
                            <button class="auditee-dropdown-button" type="button" id="auditee-select-dropdown">
                                Select auditees
                            </button>
                            <div *ngIf="false" class="auditee-dropdown-options" formControlName="auditeesValue">
                                <div class="auditee-check" *ngFor="let auditeesOption of availableOptions1">
                                    <label class="auditee-dropdown-option">
                                        <input class="auditee-check-input" type="checkbox" [value]="auditeesOption" />
                                        {{ auditeesOption }}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="city-country-row">
                    <div class="city">
                        <label for="city-name" class="form-label">City</label>
                        <select id="city-name" class="dropdown-select" formControlName="cityName" name="cityName"
                            required>
                            <option value="" disabled selected>Select City</option>
                            <option *ngFor="let cityOption of availableOptions" [value]="cityOption">
                                {{ cityOption}}</option>
                        </select>
                    </div>
                    <div class="country">
                        <label for="country-name" class="form-label">Country</label>
                        <select id="country-name" class="dropdown-select" formControlName="countryName"
                            name="countryName" required>
                            <option value="" disabled selected>Select Country</option>
                            <option *ngFor="let countryOption of availableOptions" [value]="countryOption">
                                {{ countryOption }}
                            </option>
                        </select>
                    </div>
                </div>
                <div class="audit-scope-row">
                    <div class="audit-scope-label">
                        <label for="audit-scope" class="form-label">Audit Scope</label>
                    </div>
                    <div class="auditscope-textarea">
                        <textarea id="audit-scope" class="audit-scope-textarea" rows="4"
                            formControlName="auditScopeValue" name="audit_scope" required></textarea>
                    </div>
                </div>
                <div class="button-group">
                    <button class="clear-button">Clear</button>
                    <button class="create-button">Create</button>
                </div>
            </form>
        </div>
    </div>
    <div class="calendar-section">
        <p>calender section</p>
    </div>
</div>
