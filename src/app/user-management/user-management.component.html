<div class="user-management-container">
    <div class="header-row">
        <div class="title">User Management</div>
        <div class="actions">
            <input class="search-input" type="text" placeholder="Search users" [(ngModel)]="searchQuery" (input)="applyFilter()" />
            <button class="create-user-btn" (click)="openCreateUserDialog()">Create User</button>
        </div>
    </div>

    <div class="user-table" *ngIf="filteredUsers.length > 0">
        <div class="user-row header">
            <div class="cell name">Name</div>
            <div class="cell email">Email</div>
            <div class="cell role">Role</div>
            <div class="cell department">Department</div>
            <div class="cell actions">Actions</div>
        </div>
        <div class="user-row" *ngFor="let user of filteredUsers">
            <div class="cell name">
                <span>{{user.first_name}} {{user.last_name}}</span>
                <span class="self-tag" *ngIf="user.email === currentUserEmail">You</span>
            </div>
            <div class="cell email">{{user.email}}</div>
            <div class="cell role">
                <select [ngModel]="user.roleDraft" (change)="onRoleChange(user, $event)" [disabled]="user.email === currentUserEmail">
                    <option *ngFor="let role of roles" [value]="role">{{role}}</option>
                </select>
                <button class="save-role" [disabled]="!user.isRoleDirty || user.isSaving" (click)="saveRole(user)">Save</button>
            </div>
            <div class="cell department">
                <div class="department-text">{{user.department}}</div>
                <div class="location-text" *ngIf="user.location">{{user.location}}</div>
            </div>
            <div class="cell actions">
                <button class="reset-btn" (click)="resetPassword(user)">Reset Password</button>
                <button class="delete-btn" [disabled]="user.email === currentUserEmail || user.isDeleting" (click)="deleteUser(user)">Delete</button>
            </div>
        </div>
    </div>

    <div class="empty-state" *ngIf="filteredUsers.length === 0">
        <span>No users found.</span>
    </div>
</div>
